<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Menjelajahi Indonesia - Batas Wilayah</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031323;color:white;font-family:Arial,sans-serif}
#app{width:100vw;height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle,#0b4565,#031323 65%,#01060c)}
#map{position:absolute;width:92vw;max-width:1500px;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform 1.8s ease;filter:drop-shadow(0 20px 35px #000)}
#title{position:absolute;top:6%;width:100%;text-align:center;font-size:clamp(28px,4vw,60px);font-weight:800;text-shadow:0 3px 15px #000;opacity:0;transition:.7s}
#title small{display:block;color:#ffd86b;font-size:.35em;letter-spacing:3px;margin-top:8px}
#info{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(90%,1100px);background:#031827e8;border:1px solid #62ddff77;border-radius:18px;padding:18px 24px;text-align:center;box-shadow:0 10px 35px #0008;opacity:0;transition:.6s}
#info b{display:block;color:#ffd86b;font-size:clamp(20px,2.4vw,34px);margin-bottom:7px}
#info span{font-size:clamp(16px,1.7vw,25px);line-height:1.4}
#compass{position:absolute;right:3%;top:4%;width:100px;height:100px;border:2px solid #fff8;border-radius:50%;background:#041b2dcc;opacity:0;transition:.5s}
#compass span{position:absolute;font-weight:800} .u{top:5px;left:46%} .s{bottom:5px;left:46%} .b{left:7px;top:45%} .t{right:7px;top:45%}
#cloud{position:absolute;inset:-10%;background:radial-gradient(ellipse at 20% 50%,#fff 0 12%,transparent 13%),radial-gradient(ellipse at 45% 45%,#fff 0 16%,transparent 17%),radial-gradient(ellipse at 70% 55%,#fff 0 18%,transparent 19%),#ffffffee;filter:blur(5px);opacity:0;transition:opacity 1.8s;z-index:10}
#start{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 24px;border:0;border-radius:30px;background:#11a9d0;color:#fff;font-weight:800;cursor:pointer;display:none}
#eight{position:absolute;left:3%;top:4%;display:grid;grid-template-columns:repeat(3,40px);gap:4px;opacity:0;transition:.5s}
.e{width:40px;height:40px;border-radius:9px;background:#07304acc;border:1px solid #69e4ff66;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.active{background:#0fa9d0!important;box-shadow:0 0 18px #4eeaff}
</style>
</head>
<body>
<div id="app">
<img id="map" src="" alt="Peta Indonesia">
<div id="title">MENJELAJAHI INDONESIA<small>LETAK DAN BATAS WILAYAH</small></div>
<div id="compass"><span class="u">U</span><span class="s">S</span><span class="b">B</span><span class="t">T</span></div>
<div id="eight">
<div></div><div class="e" data-d="U">U</div><div></div>
<div class="e" data-d="BL">BL</div><div class="e" data-d="TL">TL</div><div></div>
<div class="e" data-d="B">B</div><div class="e" data-d="T">T</div><div></div>
<div class="e" data-d="BD">BD</div><div class="e" data-d="TG">TG</div><div></div>
<div></div><div class="e" data-d="S">S</div><div></div>
</div>
<div id="info"><b id="head"></b><span id="text"></span></div>
<div id="cloud"></div>
<button id="start">▶ Mulai</button>
</div>

<script>
const scenes=[
[0,8,"PEMBUKAAN","Pernahkah kalian membayangkan masuk ke sebuah dunia yang terdiri dari ribuan pulau? Hari ini kita akan menjelajahi Indonesia melalui sebuah peta."],
[8,12,"INILAH INDONESIA","Inilah Indonesia, negara kepulauan yang wilayahnya terdiri atas daratan dan perairan yang luas."],
[20,12,"DELAPAN ARAH MATA ANGIN","Empat arah utama adalah Utara, Selatan, Barat, dan Timur. Di antaranya ada Timur Laut, Tenggara, Barat Daya, dan Barat Laut."],
[32,16,"LETAK GEOGRAFIS","Indonesia berada di antara Benua Asia dan Benua Australia, serta di antara Samudra Hindia dan Samudra Pasifik."],
[48,8,"MARI MENJELAJAH","Sekarang kita mencari batas wilayah Indonesia berdasarkan empat arah utama."],
[56,24,"BATAS UTARA","Di sebelah utara, Indonesia berbatasan darat dengan Malaysia di Pulau Kalimantan. Indonesia juga berbatasan laut dengan Malaysia, Singapura, Thailand, Vietnam, Filipina, dan Palau. Perairan di kawasan ini meliputi Laut China Selatan, Laut Sulawesi, dan Samudra Pasifik.","U"],
[80,22,"BATAS SELATAN","Di sebelah selatan, Indonesia berbatasan darat dengan Timor-Leste di Pulau Timor, Nusa Tenggara Timur. Indonesia juga berbatasan laut dengan Australia dan Samudra Hindia. Perairannya mencakup Laut Timor dan Laut Arafura.","S"],
[102,20,"BATAS BARAT","Di sebelah barat Indonesia terbentang Samudra Hindia. Di kawasan ini terdapat batas perairan internasional yang dekat dengan India, khususnya Kepulauan Andaman dan Nikobar.","B"],
[122,20,"BATAS TIMUR","Di sebelah timur Indonesia berbatasan darat dengan Papua Nugini di Pulau Papua. Indonesia juga berbatasan laut dengan kawasan Samudra Pasifik.","T"],
[142,12,"KEMBALI KE PETA","Kita sudah menjelajahi empat arah utama. Delapan arah mata angin membantu kita membaca posisi wilayah dengan lebih teliti."],
[154,18,"TANTANGAN PENJELAJAH PETA","Sekarang giliran kalian. Gunakan peta kalian untuk menemukan dan menuliskan batas wilayah Indonesia."],
[172,8,"SAMPAI JUMPA","Siapkan peta dan LKPD kalian. Saatnya membuktikan bahwa kalian dapat menemukan batas wilayah Indonesia sendiri.","CLOUD"]
];
const map=document.getElementById('map'), title=document.getElementById('title'), info=document.getElementById('info'),
head=document.getElementById('head'), text=document.getElementById('text'), compass=document.getElementById('compass'),
eight=document.getElementById('eight'), cloud=document.getElementById('cloud');
let t0=0, raf=0, last=-1, running=false, total=180;

function say(s) {
 if(!('speechSynthesis' in window)) return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(s); u.lang='id-ID'; u.rate=.94; u.pitch=1.02;
 speechSynthesis.speak(u);
}
function sceneAt(t) {
 let i=0;
 for(let n=0;n<scenes.length;n++) if(t>=scenes[n][0]) i=n;
 if(i===last) return;
 last=i; const s=scenes[i];
 head.textContent=s[2]; text.textContent=s[3];
 title.style.opacity=i<2?1:0;
 info.style.opacity=1;
 compass.style.opacity=i>=1&&i<=9?1:0;
 eight.style.opacity=i===2||i===9?1:0;
 document.querySelectorAll('.e').forEach(x=>x.classList.remove('active'));
 if(s[4] && s[4] !== 'CLOUD') {
   document.querySelector('[data-d="'+s[4]+'"]')?.classList.add('active');
   if(s[4]==='U') map.style.transform='translate(-50%,-56%) scale(1.55)';
   if(s[4]==='S') map.style.transform='translate(-50%,-43%) scale(1.55)';
   if(s[4]==='B') map.style.transform='translate(-43%,-50%) scale(1.65)';
   if(s[4]==='T') map.style.transform='translate(-57%,-50%) scale(1.65)';
 } else map.style.transform='translate(-50%,-50%) scale(1)';
 if(s[4]==='CLOUD') cloud.style.opacity=1; else cloud.style.opacity=0;
 say(s[3]);
}
function loop(ts) {
 if(!running) return;
 if(!t0) t0=ts;
 const t=(ts-t0)/1000;
 if(t>=total) { running=false; return; }
 sceneAt(t);
 raf=requestAnimationFrame(loop);
}
function start() {
 if(running) return;
 running=true; t0=performance.now(); last=-1; loop(t0);
}
window.addEventListener('load',()=>setTimeout(start,500));
</script>
</body>
</html>
