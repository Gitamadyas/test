<div id="flashcard-peta-indonesia">
  <style>
    #flashcard-peta-indonesia {
      --teks: #18324a;
      --teks-lembut: #617487;
      --latar: #eef7fb;
      --putih: #ffffff;
      --bayangan: 0 18px 45px rgba(22, 70, 100, 0.14);
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--teks);
      background:
        radial-gradient(circle at 8% 8%, rgba(50, 190, 180, 0.15), transparent 25%),
        radial-gradient(circle at 94% 14%, rgba(255, 208, 90, 0.20), transparent 25%),
        var(--latar);
      border-radius: 28px;
    }

    #flashcard-peta-indonesia *,
    #flashcard-peta-indonesia *::before,
    #flashcard-peta-indonesia *::after {
      box-sizing: border-box;
    }

    #flashcard-peta-indonesia .fi-header {
      text-align: center;
      margin-bottom: 18px;
    }

    #flashcard-peta-indonesia .fi-label {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      background: #d9f1f2;
      color: #16777b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #flashcard-peta-indonesia h2 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      line-height: 1.08;
      color: #123d5a;
    }

    #flashcard-peta-indonesia .fi-subtitle {
      margin: 10px auto 0;
      max-width: 620px;
      color: var(--teks-lembut);
      font-size: 15px;
      line-height: 1.5;
    }

    #flashcard-peta-indonesia .fi-map {
      position: relative;
      overflow: hidden;
      min-height: 170px;
      margin: 18px 0 22px;
      padding: 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, #d9f4f4, #eff9ff);
      border: 1px solid rgba(38, 123, 151, 0.12);
    }

    #flashcard-peta-indonesia .fi-map::before,
    #flashcard-peta-indonesia .fi-map::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(55, 143, 163, 0.18);
      border-radius: 50%;
      pointer-events: none;
    }

    #flashcard-peta-indonesia .fi-map::before {
      width: 300px;
      height: 130px;
      left: -80px;
      top: 70px;
      transform: rotate(-8deg);
    }

    #flashcard-peta-indonesia .fi-map::after {
      width: 340px;
      height: 150px;
      right: -100px;
      top: -75px;
      transform: rotate(12deg);
    }

    #flashcard-peta-indonesia .fi-map svg {
      display: block;
      width: 100%;
      height: 142px;
      position: relative;
      z-index: 1;
    }

    #flashcard-peta-indonesia .fi-map-title {
      position: absolute;
      left: 18px;
      bottom: 14px;
      z-index: 2;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      color: #28647a;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    #flashcard-peta-indonesia .fi-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--teks-lembut);
      font-size: 13px;
      font-weight: 700;
    }

    #flashcard-peta-indonesia .fi-group {
      color: var(--accent);
    }

    #flashcard-peta-indonesia .fi-card-area {
      perspective: 1200px;
      min-height: 310px;
    }

    #flashcard-peta-indonesia .fi-card {
      position: relative;
      width: 100%;
      min-height: 310px;
      cursor: pointer;
      outline: none;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.2, 0.75, 0.25, 1);
    }

    #flashcard-peta-indonesia .fi-card.is-flipped {
      transform: rotateY(180deg);
    }

    #flashcard-peta-indonesia .fi-face {
      position: absolute;
      inset: 0;
      min-height: 310px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: var(--bayangan);
      border: 1px solid rgba(20, 72, 100, 0.08);
    }

    #flashcard-peta-indonesia .fi-front {
      background: var(--putih);
    }

    #flashcard-peta-indonesia .fi-back {
      transform: rotateY(180deg);
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #ffffff;
    }

    #flashcard-peta-indonesia .fi-corner {
      position: absolute;
      top: 20px;
      left: 22px;
      font-size: 28px;
    }

    #flashcard-peta-indonesia .fi-face-label {
      margin-bottom: 14px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #flashcard-peta-indonesia .fi-back .fi-face-label {
      color: rgba(255, 255, 255, 0.8);
    }

    #flashcard-peta-indonesia .fi-text {
      max-width: 700px;
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.25;
      font-weight: 800;
    }

    #flashcard-peta-indonesia .fi-hint {
      position: absolute;
      bottom: 20px;
      color: var(--teks-lembut);
      font-size: 12px;
    }

    #flashcard-peta-indonesia .fi-back .fi-hint {
      color: rgba(255, 255, 255, 0.78);
    }

    #flashcard-peta-indonesia .fi-answer {
      max-width: 740px;
      margin: 0;
      font-size: clamp(26px, 5vw, 43px);
      line-height: 1.18;
      font-weight: 900;
    }

    #flashcard-peta-indonesia .fi-progress {
      height: 7px;
      overflow: hidden;
      margin-top: 18px;
      border-radius: 999px;
      background: #dbe8ee;
    }

    #flashcard-peta-indonesia .fi-progress-bar {
      width: 7.14%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 0.35s ease, background 0.35s ease;
    }

    #flashcard-peta-indonesia .fi-controls {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    #flashcard-peta-indonesia .fi-button {
      min-height: 46px;
      padding: 10px 14px;
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
    }

    #flashcard-peta-indonesia .fi-button:hover {
      transform: translateY(-2px);
    }

    #flashcard-peta-indonesia .fi-button:active {
      transform: translateY(0);
    }

    #flashcard-peta-indonesia .fi-button:focus-visible,
    #flashcard-peta-indonesia .fi-card:focus-visible {
      outline: 4px solid rgba(35, 142, 180, 0.35);
      outline-offset: 3px;
    }

    #flashcard-peta-indonesia .fi-prev,
    #flashcard-peta-indonesia .fi-next {
      background: #ffffff;
      color: #24526b;
      border: 1px solid #d7e5eb;
    }

    #flashcard-peta-indonesia .fi-flip {
      background: var(--accent);
      color: #ffffff;
    }

    #flashcard-peta-indonesia .fi-extra {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    #flashcard-peta-indonesia .fi-shuffle {
      background: transparent;
      color: #397083;
      border: 1px dashed #9cc6d2;
      padding: 8px 15px;
      min-height: 38px;
    }

    @media (max-width: 560px) {
      #flashcard-peta-indonesia {
        padding: 15px;
        border-radius: 20px;
      }

      #flashcard-peta-indonesia .fi-map {
        min-height: 145px;
      }

      #flashcard-peta-indonesia .fi-map svg {
        height: 120px;
      }

      #flashcard-peta-indonesia .fi-card-area,
      #flashcard-peta-indonesia .fi-card,
      #flashcard-peta-indonesia .fi-face {
        min-height: 280px;
      }

      #flashcard-peta-indonesia .fi-face {
        padding: 25px 18px;
      }

      #flashcard-peta-indonesia .fi-controls {
        grid-template-columns: 1fr 1fr;
      }

      #flashcard-peta-indonesia .fi-flip {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      #flashcard-peta-indonesia .fi-prev {
        grid-column: 1;
        grid-row: 2;
      }

      #flashcard-peta-indonesia .fi-next {
        grid-column: 2;
        grid-row: 2;
      }
    }
  </style>

  <div class="fi-header">
    <div class="fi-label">Belajar Geografi Indonesia</div>
    <h2>Flashcard Peta Indonesia</h2>
    <p class="fi-subtitle">
      Baca soal, pikirkan jawabannya, lalu klik kartu untuk membaliknya.
    </p>
  </div>

  <div class="fi-map" aria-label="Ilustrasi peta Indonesia">
    <svg viewBox="0 0 900 180" role="img" aria-label="Ilustrasi kepulauan Indonesia">
      <defs>
        <filter id="fi-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.16"/>
        </filter>
      </defs>

      <!-- Sumatera -->
      <path
        d="M55 70 L108 47 L155 59 L143 78 L111 86 L94 106 L58 103 L36 87 Z"
        fill="#36b88f"
        filter="url(#fi-shadow)"
      />

      <!-- Jawa -->
      <path
        d="M205 124 L267 119 L314 127 L302 139 L250 142 L207 137 Z"
        fill="#4f93e6"
        filter="url(#fi-shadow)"
      />

      <!-- Bangka Belitung -->
      <circle cx="170" cy="94" r="8" fill="#8364c8"/>
      <circle cx="183" cy="101" r="6" fill="#8364c8"/>

      <!-- Kalimantan -->
      <path
        d="M310 43 L391 31 L457 50 L443 89 L407 105 L355 94 L322 75 Z"
        fill="#e6b92e"
        filter="url(#fi-shadow)"
      />

      <!-- Sulawesi -->
      <path
        d="M500 55 L527 43 L543 62 L570 54 L590 70 L568 83 L543 76 L527 107 L511 94 L519 73 L493 68 Z"
        fill="#ee8c35"
        filter="url(#fi-shadow)"
      />

      <!-- Kepulauan Seribu -->
      <circle cx="280" cy="106" r="5" fill="#e98ab1"/>
      <circle cx="293" cy="102" r="4" fill="#e98ab1"/>
      <circle cx="303" cy="108" r="4" fill="#e98ab1"/>

      <!-- Papua -->
      <path
        d="M665 72 L723 52 L797 60 L853 82 L834 108 L774 104 L724 119 L686 103 Z"
        fill="#e45858"
        filter="url(#fi-shadow)"
      />

      <!-- Garis laut -->
      <path d="M20 151 C170 130 305 160 450 143 S720 130 880 150"
            fill="none" stroke="#83cbd5" stroke-width="2" stroke-dasharray="6 8"/>
      <path d="M20 164 C170 143 305 173 450 156 S720 143 880 163"
            fill="none" stroke="#addfe5" stroke-width="2" stroke-dasharray="4 9"/>
    </svg>

    <div class="fi-map-title">PETA INDONESIA</div>
  </div>

  <div class="fi-status">
    <span id="fi-card-number">Kartu 1 dari 14</span>
    <span id="fi-group" class="fi-group">Kelompok Sumatera</span>
  </div>

  <div class="fi-card-area">
    <div
      id="fi-card"
      class="fi-card"
      role="button"
      tabindex="0"
      aria-label="Klik untuk membalik kartu"
    >
      <div class="fi-face fi-front">
        <div class="fi-corner">🧭</div>
        <div class="fi-face-label">Pertanyaan</div>
        <p id="fi-question" class="fi-text"></p>
        <div class="fi-hint">Klik kartu untuk melihat jawaban</div>
      </div>

      <div class="fi-face fi-back">
        <div class="fi-corner">📍</div>
        <div class="fi-face-label">Jawaban</div>
        <p id="fi-answer" class="fi-answer"></p>
        <div class="fi-hint">Klik kartu untuk kembali ke soal</div>
      </div>
    </div>
  </div>

  <div class="fi-progress" aria-hidden="true">
    <div id="fi-progress-bar" class="fi-progress-bar"></div>
  </div>

  <div class="fi-controls">
    <button id="fi-prev" class="fi-button fi-prev" type="button">
      ← Sebelumnya
    </button>

    <button id="fi-flip" class="fi-button fi-flip" type="button">
      Balik Kartu
    </button>

    <button id="fi-next" class="fi-button fi-next" type="button">
      Berikutnya →
    </button>
  </div>

  <div class="fi-extra">
    <button id="fi-shuffle" class="fi-button fi-shuffle" type="button">
      🔀 Acak Kartu
    </button>
  </div>

  <script>
    (function () {
      const root = document.getElementById("flashcard-peta-indonesia");

      const cards = [
        {
          group: "Kelompok Sumatera",
          question: "Sumatera berada di bagian mana Indonesia?",
          answer: "Bagian barat Indonesia.",
          accent: "#36b88f",
          dark: "#16856c"
        },
        {
          group: "Kelompok Sumatera",
          question: "Samudra apa yang berada di sebelah barat Sumatera?",
          answer: "Samudra Hindia.",
          accent: "#36b88f",
          dark: "#16856c"
        },
        {
          group: "Kelompok Jawa",
          question: "Jawa berada di bagian mana Indonesia?",
          answer: "Bagian tengah Indonesia.",
          accent: "#4f93e6",
          dark: "#2c65b1"
        },
        {
          group: "Kelompok Jawa",
          question: "Samudra apa yang berada di sebelah selatan Jawa?",
          answer: "Samudra Hindia.",
          accent: "#4f93e6",
          dark: "#2c65b1"
        },
        {
          group: "Kelompok Kalimantan",
          question: "Negara apa yang berbatasan darat dengan Indonesia di Kalimantan?",
          answer: "Malaysia.",
          accent: "#e6b92e",
          dark: "#b88b13"
        },
        {
          group: "Kelompok Kalimantan",
          question: "Kalimantan berada di bagian mana Indonesia?",
          answer: "Bagian tengah Indonesia.",
          accent: "#e6b92e",
          dark: "#b88b13"
        },
        {
          group: "Kelompok Sulawesi",
          question: "Sulawesi berada di bagian mana Indonesia?",
          answer: "Bagian tengah Indonesia.",
          accent: "#ee8c35",
          dark: "#bd5f16"
        },
        {
          group: "Kelompok Sulawesi",
          question: "Laut apa yang berada di sebelah utara Sulawesi?",
          answer: "Laut Sulawesi.",
          accent: "#ee8c35",
          dark: "#bd5f16"
        },
        {
          group: "Kelompok Papua",
          question: "Negara apa yang berbatasan darat dengan Indonesia di Papua?",
          answer: "Papua Nugini.",
          accent: "#e45858",
          dark: "#ae303d"
        },
        {
          group: "Kelompok Papua",
          question: "Samudra apa yang berada di sebelah timur Papua?",
          answer: "Samudra Pasifik.",
          accent: "#e45858",
          dark: "#ae303d"
        },
        {
          group: "Kelompok Bangka Belitung",
          question: "Bangka Belitung berada di sebelah timur pulau apa?",
          answer: "Pulau Sumatera.",
          accent: "#8364c8",
          dark: "#5c409b"
        },
        {
          group: "Kelompok Bangka Belitung",
          question: "Selat apa yang memisahkan Bangka dan Sumatera?",
          answer: "Selat Bangka.",
          accent: "#8364c8",
          dark: "#5c409b"
        },
        {
          group: "Kelompok Kepulauan Seribu",
          question: "Kepulauan Seribu berada di sebelah utara pulau apa?",
          answer: "Pulau Jawa.",
          accent: "#e98ab1",
          dark: "#bb527f"
        },
        {
          group: "Kelompok Kepulauan Seribu",
          question: "Kepulauan Seribu berada di wilayah provinsi apa?",
          answer: "DKI Jakarta.",
          accent: "#e98ab1",
          dark: "#bb527f"
        }
      ];

      let current = 0;
      let deck = cards.slice();

      const card = root.querySelector("#fi-card");
      const question = root.querySelector("#fi-question");
      const answer = root.querySelector("#fi-answer");
      const cardNumber = root.querySelector("#fi-card-number");
      const group = root.querySelector("#fi-group");
      const progress = root.querySelector("#fi-progress-bar");
      const previous = root.querySelector("#fi-prev");
      const next = root.querySelector("#fi-next");
      const flip = root.querySelector("#fi-flip");
      const shuffle = root.querySelector("#fi-shuffle");

      function updateCard() {
        const item = deck[current];

        card.classList.remove("is-flipped");
        question.textContent = item.question;
        answer.textContent = item.answer;
        cardNumber.textContent = "Kartu " + (current + 1) + " dari " + deck.length;
        group.textContent = item.group;

        root.style.setProperty("--accent", item.accent);
        root.style.setProperty("--accent-dark", item.dark);
        progress.style.width = ((current + 1) / deck.length * 100) + "%";
        progress.style.background = item.accent;
        group.style.color = item.accent;
      }

      function flipCard() {
        card.classList.toggle("is-flipped");
      }

      function goPrevious() {
        current = (current - 1 + deck.length) % deck.length;
        updateCard();
      }

      function goNext() {
        current = (current + 1) % deck.length;
        updateCard();
      }

      function shuffleCards() {
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        current = 0;
        updateCard();
      }

      card.addEventListener("click", flipCard);
      flip.addEventListener("click", flipCard);
      previous.addEventListener("click", goPrevious);
      next.addEventListener("click", goNext);
      shuffle.addEventListener("click", shuffleCards);

      card.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          flipCard();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (!root.matches(":hover") && document.activeElement !== card) return;

        if (event.key === "ArrowLeft") goPrevious();
        if (event.key === "ArrowRight") goNext();
        if (event.key === "Escape") card.classList.remove("is-flipped");
      });

      updateCard();
    })();
  </script>
</div>
